<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Formulario</h1>
  <p>Esto es un texto</p>
  <form action="/index.html" class="formulario" method="post">

    <div>
      <label for="nombre">Nombre Completo</label>
      <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required/>
    </div>
    
    <div>
      <label for="email">Correo electronico</label>
      <input type="email" id="email" name="email" placeholder="usuario@correo.com" required/>
    </div>
   
    <div>
      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" name="telefono" placeholder="+34 123 456 789"/> 
    </div>
    
    <div>
      <label for="fecha">Fecha</label>
      <input type="date" id="fecha" name="fecha"/>
    </div>
    


    <!-- input de tipo radio -->

    <div>
      <label class="">
        <input type="radio" name="pago" value="debito"/>
        Debito
      </label>

      <label class="radio-label">
        <input type="radio" name="pago" value="credito"/>
        Credito
      </label>
      
    </div>

    <!-- select  -->
     <select name="pais">
        <option value="">Selecciona tu país</option>
        <option value="españa">España</option>
        <option value="mexico">Mexico</option>
        <option value="chile">Chile</option>
        <option value="argentina">Argentina</option>
        <option value="colombia">Colombia</option>
     </select>
    <div>
      <button type="submit">Enviar</button>
    </div>
     
  </form>
</body>
</html>
